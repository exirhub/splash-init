name: Verify Splash Init

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n aws.sh
          if [ -f vendor/proxyfleet-xui-sync/install.sh ]; then
            bash -n vendor/proxyfleet-xui-sync/install.sh
          fi
      - name: Safe installer tests and read-only seed validation
        env:
          REQUIRE_SPLASH_SEEDS: '1'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Vendored sync regression checks
        run: |
          if [ -f vendor/proxyfleet-xui-sync/tests/smoke_test.py ]; then
            python3 vendor/proxyfleet-xui-sync/tests/smoke_test.py
          fi
